[workspace]
resolver = "2"

members = [
    "contracts/fund_pool",
    "contracts/distribution",
    "contracts/beneficiary_registry",
    "contracts/milestone_engine",
    "contracts/audit",
]

[workspace.dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.test-optimized]
inherits = "test"
opt-level = "z"
